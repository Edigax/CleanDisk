<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Drive Body Gradient -->
    <linearGradient id="driveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Sparkle Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- macOS App Squircle Shape -->
  <rect x="32" y="32" width="448" height="448" rx="100" ry="100" fill="url(#bgGrad)" filter="url(#dropShadow)" />

  <!-- Subtle Inner Radial Rim Accent -->
  <rect x="34" y="34" width="444" height="444" rx="98" ry="98" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2" />

  <!-- External Disk Graphic -->
  <g filter="url(#dropShadow)">
    <!-- Main Drive Body -->
    <rect x="136" y="240" width="240" height="150" rx="20" ry="20" fill="url(#driveGrad)" />

    <!-- Top Drive Plate Accents -->
    <rect x="156" y="260" width="200" height="6" rx="3" ry="3" fill="#94A3B8" />

    <!-- Status Activity LED -->
    <circle cx="170" cy="340" r="10" fill="#10B981" filter="url(#glow)" />
    <circle cx="170" cy="340" r="5" fill="#A7F3D0" />

    <!-- Drive Port / Slot Indicator -->
    <rect x="210" y="334" width="130" height="12" rx="6" ry="6" fill="#475569" />
  </g>

  <!-- Big Sparkling Star (Purified / Clean Emblem) -->
  <g filter="url(#glow)">
    <path d="M 350,110
             Q 350,170 410,170
             Q 350,170 350,230
             Q 350,170 290,170
             Q 350,170 350,110 Z"
          fill="url(#goldGrad)" />
  </g>

  <!-- Secondary White Sparkle -->
  <path d="M 180,130
           Q 180,165 215,165
           Q 180,165 180,200
           Q 180,165 145,165
           Q 180,165 180,130 Z"
        fill="#FFFFFF"
        opacity="0.95" />

  <!-- Tiny Accent Sparkle -->
  <path d="M 370,260
           Q 370,280 390,280
           Q 370,280 370,300
           Q 370,280 350,280
           Q 370,280 370,260 Z"
        fill="#FFFFFF"
        opacity="0.8" />
</svg>
